<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <!-- Seal plate — bold dark ground, brass edge like a wax stamp -->
  <rect x="2" y="2" width="36" height="36" rx="9"
    fill="#3a2a1d" stroke="#a8813f" stroke-width="1.4" />

  <!-- Steam — bold solid comma shapes, not hairline curls.
       Cream against dark ink plate for maximum contrast at tiny sizes. -->
  <path d="M15.5 12.2 C13.3 10.1 16.6 8.2 14.9 6.1 C17.9 7.5 17.6 10.7 15.5 12.2 Z"
    fill="#f2ead9" />
  <path d="M24.5 12.2 C26.7 10.1 23.4 8.2 25.1 6.1 C22.1 7.5 22.4 10.7 24.5 12.2 Z"
    fill="#f2ead9" />

  <!-- Tumbler — bold solid silhouette, reads as glass via contrast
       against the dark plate (no stroke needed, flatter & bolder). -->
  <path d="M12 14.5 L28 14.5 L24.2 29.3 C24 30.2 23.2 30.8 22.2 30.8
           L17.8 30.8 C16.8 30.8 16 30.2 15.8 29.3 Z"
    fill="#f2ead9" />

  <!-- Fill line — thick jade band, brand accent color, reads as
       "liquid level" at a glance. -->
  <rect x="14.4" y="19.6" width="11.2" height="3.1" fill="#3f6b52" />
</svg>